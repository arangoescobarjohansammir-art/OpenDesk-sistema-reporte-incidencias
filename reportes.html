<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="vendor/datatables/css/datatables.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <title>Reportes - OpenDesk</title>
  </head>

  <body class="bg-body-tertiary">
    <nav id="sidebar" class="shadow">
      <div
        class="px-3 pb-3 mb-2 fs-4 fw-bold text-white border-bottom border-secondary"
      >
        OpenDesk
      </div>
      <a href="index.html" class="rounded-2 mx-2 mb-1">Inicio</a>
      <a href="usuarios.html" class="rounded-2 mx-2 mb-1">Usuarios</a>
      <a href="incidencias.html" class="rounded-2 mx-2 mb-1">Incidencias</a>
      <a
        href="reportes.html"
        class="rounded-2 mx-2 mb-1 active"
        aria-current="page"
        >Reportes</a
      >
    </nav>
    <button
      id="menuMovil"
      class="btn btn-dark m-2 shadow-sm"
      onclick="mostrarMenu()"
      aria-label="Abrir menú"
    >
      ☰
    </button>
    <main class="p-4 pt-5 pt-md-4">
      <h1 class="h2 fw-bold mb-4">Reportes</h1>
      <p class="text-secondary mb-3">Consulta y exportación de incidencias.</p>
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body">
          <table
            id="reportesTable"
            class="table table-striped table-hover align-middle mb-0"
          >
            <thead class="table-light">
              <tr>
                <th data-priority="3">id</th>
                <th data-priority="1">usuario</th>
                <th data-priority="7">asunto</th>
                <th data-priority="6">categoria</th>
                <th data-priority="5">prioridad</th>
                <th data-priority="4">estado</th>
                <th data-priority="2">fecha</th>
              </tr>
            </thead>
            <tbody id="repBody"></tbody>
          </table>
        </div>
      </div>
    </main>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="vendor/datatables/js/datatables.min.js"></script>
    <script src="vendor/JSZip/js/jszip.min.js"></script>
    <script src="vendor/pdfmake/js/pdfmake.js"></script>
    <script src="vendor/pdfmake/js/vfs_fonts.js"></script>
    <script src="vendor/localforage/localforage.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reportes.js"></script>
  </body>
</html>
