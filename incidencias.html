<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/datatables/css/datatables.min.css">
    <link rel="stylesheet" href="vendor/sweetalert2/css/sweetalert2.min.css">
    <link rel="stylesheet" href="css/app.css">
    <title>Incidencias - OpenDesk</title>
</head>

<body class="bg-body-tertiary">
    <nav id="sidebar" class="shadow">
        <div class="px-3 pb-3 mb-2 fs-4 fw-bold text-white border-bottom border-secondary">OpenDesk</div>
        <a href="index.html" class="rounded-2 mx-2 mb-1">Inicio</a>
        <a href="usuarios.html" class="rounded-2 mx-2 mb-1">Usuarios</a>
        <a href="incidencias.html" class="rounded-2 mx-2 mb-1 active" aria-current="page">Incidencias</a>
        <a href="reportes.html" class="rounded-2 mx-2 mb-1">Reportes</a>
    </nav>
    <button id="menuMovil" class="btn btn-dark m-2 shadow-sm" onclick="mostrarMenu()" aria-label="Abrir menú">☰</button>
    <main class="p-4 pt-5 pt-md-4">
        <h1 class="h2 fw-bold mb-4">Incidencias</h1>
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body">
                <table id="incidenciasTable" class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th data-priority="3">id</th>
                            <th data-priority="1">usuario</th>
                            <th data-priority="8">asunto</th>
                            <th data-priority="6">categoria</th>
                            <th data-priority="5">prioridad</th>
                            <th data-priority="4">estado</th>
                            <th data-priority="7">fecha</th>
                            <th data-priority="2" class="no-export">acciones</th>
                        </tr>
                    </thead>
                    <tbody id="incidenciasBody">
                    </tbody>
                </table>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-3">
            <button type="button" id="crearIncidencia" class="btn btn-primary shadow-sm"
                onclick="nuevaIncidencia()">Nueva
                Incidencia</button>
            <button type="button" id="recargarIncidenciaBtn" class="btn btn-outline-secondary"
                onclick="recargarIncidencias()">Recargar
                Incidencias</button>
        </div>
        <div id="incidenciasModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="incidenciaModalTitle">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content border-0 shadow-lg rounded-4">
                    <div class="modal-header bg-body-tertiary border-0 rounded-top-4">
                        <h2 id="incidenciaModalTitle" class="modal-title fs-4 fw-bold">nueva incidencia</h2>
                    </div>
                    <form id="incidenciasForm">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="usuario" class="form-label">Elige un usuario:</label>
                                <select name="usuario" id="SelectUsuarios" class="form-select">
                                    <option value="-1">Selecciona un usuario</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="asunto" class="form-label">asunto</label>
                                <input type="text" id="asunto" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="categoria" class="form-label">Elige una categoria:</label>
                                <select name="categoria" id="selectCategoria" class="form-select">
                                    <option value="Hardware">Hardware</option>
                                    <option value="Software">Software</option>
                                    <option value="Conectividad">Conectividad</option>
                                    <option value="Acceso">Acceso</option>
                                    <option value="Otro">Otro</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="prioridad" class="form-label">Elige la prioridad:</label>
                                <select name="prioridad" id="selectPrioridad" class="form-select">
                                    <option value="Baja">Baja</option>
                                    <option value="Media">Media</option>
                                    <option value="Alta">Alta</option>
                                    <option value="Critica">Critica</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="estado" class="form-label">Elige el estado: </label>
                                <select name="estado" id="selectEstado" class="form-select">
                                    <option value="Abierta">Abierta</option>
                                    <option value="En proceso">En proceso</option>
                                    <option value="Resuelta">Resuelta</option>
                                    <option value="Cerrada">Cerrada</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="fecha" class="form-label">fecha</label>
                                <input type="date" id="fecha" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">descripcion</label>
                                <textarea id="descripcion" name="descripcion" rows="4" cols="50"
                                    class="form-control"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer bg-body-tertiary border-0 rounded-bottom-4">
                            <button type="submit" id="guardar" class="btn btn-primary">Guardar</button>
                            <button type="button" id="cancelar" class="btn btn-outline-secondary"
                                onclick="cerrarFormulario()">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        </div>
    </main>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="vendor/datatables/js/datatables.min.js"></script>
    <script src="vendor/JSZip/js/jszip.min.js"></script>
    <script src="vendor/pdfmake/js/pdfmake.js"></script>
    <script src="vendor/pdfmake/js/vfs_fonts.js"></script>
    <script src="js/app.js"></script>
    <script src="vendor/just-validate/just-validate.production.min.js"></script>
    <script src="vendor/sweetalert2/js/sweetalert2.all.min.js"></script>
    <script src="vendor/localforage/localforage.min.js"></script>
    <script src="js/incidencias.js"></script>
</body>

</html>
