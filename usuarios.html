<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/datatables/css/datatables.min.css">
    <link rel="stylesheet" href="vendor/sweetalert2/css/sweetalert2.min.css">
    <link rel="stylesheet" href="css/app.css">
    <title>Usuarios - OpenDesk</title>
</head>

<body class="bg-body-tertiary">

    <nav id="sidebar" class="shadow">
        <div class="px-3 pb-3 mb-2 fs-4 fw-bold text-white border-bottom border-secondary">OpenDesk</div>
        <a href="index.html" class="rounded-2 mx-2 mb-1">Inicio</a>
        <a href="usuarios.html" class="rounded-2 mx-2 mb-1 active" aria-current="page">Usuarios</a>
        <a href="incidencias.html" class="rounded-2 mx-2 mb-1">Incidencias</a>
        <a href="reportes.html" class="rounded-2 mx-2 mb-1">Reportes</a>
    </nav>
    <button id="menuMovil" class="btn btn-dark m-2 shadow-sm" onclick="mostrarMenu()" aria-label="Abrir menú">☰</button>
    <main class="p-4 pt-5 pt-md-4">
        <h1 class="h2 fw-bold mb-4">Usuarios</h1>
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body">
                <table id="usersTable" class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th data-priority="3">id</th>
                            <th data-priority="1">nombre</th>
                            <th data-priority="7">correo</th>
                            <th data-priority="5">rol</th>
                            <th data-priority="6">departamento</th>
                            <th data-priority="4">activo</th>
                            <th data-priority="2" class="no-export">acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody">
                    </tbody>
                </table>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-3">
            <button type="button" id="crearUsuario" class="btn btn-primary shadow-sm" onclick="nuevoUsuario()">Nuevo
                Usuario</button>
            <button type="button" id="recargarUsuario" class="btn btn-outline-secondary"
                onclick="recargarUsuarios()">Recargar
                Usuarios</button>
        </div>
        <div id="userModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="userModalTitle">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content border-0 shadow-lg rounded-4">
                    <div class="modal-header bg-body-tertiary border-0 rounded-top-4">
                        <h2 id="userModalTitle" class="modal-title fs-4 fw-bold">nuevo usuario</h2>
                    </div>
                    <form id="userForm">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">nombre</label>
                                <input type="text" id="nombre" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo</label>
                                <input type="email" id="correo" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="rol" class="form-label">Elige un rol:</label>
                                <select name="rol" id="rol" class="form-select">
                                    <option value="Administrador">Administrador</option>
                                    <option value="Empleado">Empleado</option>
                                    <option value="Supervisor">Supervisor</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="departamento" class="form-label">Elige un departamento:</label>
                                <select name="departamento" id="departamento" class="form-select">
                                    <option value="Ventas">Ventas</option>
                                    <option value="Recursos Humanos">Recursos Humanos</option>
                                    <option value="Tecnología">Tecnología</option>
                                    <option value="Contabilidad">Contabilidad</option>
                                    <option value="Marketing">Marketing</option>
                                    <option value="Operaciones">Operaciones</option>
                                    <option value="Logística">Logística</option>
                                    <option value="Producción">Producción</option>
                                    <option value="Servicio al Cliente">Servicio al Cliente</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="activo" class="form-label">Elige un estado:</label>
                                <select name="activo" id="activo" class="form-select">
                                    <option value="true">Activo</option>
                                    <option value="false">Inactivo</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer bg-body-tertiary border-0 rounded-bottom-4">
                            <button type="submit" id="guardar" class="btn btn-primary">Guardar</button>
                            <button type="button" id="cancelar" class="btn btn-outline-secondary"
                                onclick="cerrarFormulario()">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        </div>
    </main>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="vendor/datatables/js/datatables.min.js"></script>
    <script src="vendor/JSZip/js/jszip.min.js"></script>
    <script src="vendor/pdfmake/js/pdfmake.js"></script>
    <script src="vendor/pdfmake/js/vfs_fonts.js"></script>
    <script src="js/app.js"></script>
    <script src="vendor/just-validate/just-validate.production.min.js"></script>
    <script src="vendor/sweetalert2/js/sweetalert2.all.min.js"></script>
    <script src="vendor/localforage/localforage.min.js"></script>
    <script src="js/usuarios.js"></script>
</body>

</html>
